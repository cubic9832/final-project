[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender"
version = "1.0.0"
description = "구매 전 프로필로 차량 라벨을 추천하는 학습 코드"
requires-python = ">=3.11"
dependencies = ["numpy", "torch"]

[project.scripts]
recommender = "recommender.cli:main"

[tool.setuptools]
packages = ["recommender", "recommender.models", "vehicle"]
