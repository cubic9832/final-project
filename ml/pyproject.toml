[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender"
version = "1.0.0"
description = "사용자·차량 비교 학습과 차량 추천 API"
requires-python = ">=3.11"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
recommender = "legacy.recommender.cli:main"

[tool.setuptools]
packages = ["vehicle_matching", "experiments", "legacy", "legacy.recommender", "legacy.recommender.models"]
