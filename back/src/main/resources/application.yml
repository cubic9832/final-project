spring:
  application:
    name: back
  # DB 접속 정보
  datasource:
    url: jdbc:mysql://localhost:3306/final_sample?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: server
    password: server
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 서버 시작 시 classpath:db/migration 의 SQL 을 버전 순서대로 적용
  # 보완 7: 인증 메일 발송 (Gmail SMTP)
  # 계정 · 앱 비밀번호는 코드 · git 에 넣지 않고 환경변수 MAIL_USERNAME · MAIL_PASSWORD 로만 넣는다.
  # 둘 다 없으면 메일을 보내지 않고 서버 로그에 인증 코드를 찍는다 (개발 모드)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    # 테이블이 이미 있는 DB 에서도 V1 부터 적용
    baseline-on-migrate: true
    baseline-version: 0

# 서버 포트 (React 의 vite.config.js API_TARGET 과 같아야 한다)
server:
  port: 8080

mybatis:
  # Mapper XML 위치
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    # 컬럼명이 sector_name 처럼 snake_case 여도 자바 필드 sectorName 에 자동 매핑
    map-underscore-to-camel-case: true

# 로그인 토큰 설정
jwt:
  # 토큰 서명 키. 32바이트(영문 32자) 이상이어야 서버가 시작된다.
  # 환경변수 JWT_SECRET 이 있으면 그 값을 쓰고, 없으면 아래 로컬 개발용 값을 쓴다. 배포할 때는 반드시 환경변수로 바꾼다.
  secret: ${JWT_SECRET:creditcompass-local-dev-secret-key-change-me-0123456789}
  # access token 유효 시간 (30m = 30분, 10s = 10초)
  access-token-validity: 30m
  # refresh token 유효 시간 (14d = 14일). 이 기간 동안 브라우저를 껐다 켜도 로그인이 유지된다
  refresh-token-validity: 14d
  # refresh token 쿠키의 Secure 속성 (true 면 https 에서만 전송). 로컬 http 개발은 false, 배포할 때 환경변수로 true
  cookie-secure: ${JWT_COOKIE_SECURE:false}

# 보완 7 추가: 인증 메일 서버 전체 하루 발송 상한 (개인 Gmail 한도는 확인 필요 → 넉넉히 낮게)
verification:
  daily-limit: ${VERIFICATION_DAILY_LIMIT:300}

# 보완 8: 구글 로그인 Client ID (Google Cloud Console → OAuth 클라이언트 ID, 웹). Client Secret 은 쓰지 않는다
# 환경변수 GOOGLE_CLIENT_ID 가 없으면 구글 로그인은 "설정 필요" 로 응답한다 (화면용은 front 의 VITE_GOOGLE_CLIENT_ID)
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# 보완 6: Google reCAPTCHA v2 ("로봇이 아닙니다" 체크박스) 비밀 키
# 환경변수 RECAPTCHA_SECRET_KEY 가 있으면 그 값을 쓰고, 없으면 구글이 공개한 테스트 키(항상 통과)를 쓴다.
# 실제 비밀 키는 코드 · git 에 넣지 않고 환경변수로만 넣는다. (화면용 사이트 키는 front 의 VITE_RECAPTCHA_SITE_KEY)
recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}

# 실행되는 SQL 을 콘솔에서 보기 위한 로그 레벨
logging:
  level:
    com.kh.back: debug
