# 총관리자 시드 (7단계) — 관리자 화면을 써 볼 때만
# 1. 이 파일을 복사해서 같은 폴더(back)에 admin-seed.local.properties 로 저장 (git 에 올라가지 않음)
# 2. 아래 두 줄에 이메일 · 비밀번호를 적는다 (단톡에서 정한 값). 비밀번호 규칙: 8~20자, 영문 · 숫자 · 특수문자 포함
# 3. 서버를 다시 켜면 그 계정이 총관리자가 된다 → /admin/login 으로 로그인
#    이미 가입한 이메일이면 비밀번호는 그대로 두고 권한만 총관리자로 바뀐다
admin.seed.email=
admin.seed.password=
