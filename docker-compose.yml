# 개발용 MySQL. 접속 정보는 back/src/main/resources/application.yml 과 같아야 한다.
# 테이블은 여기서 만들지 않고 Spring Boot 시작 시 Flyway(back/src/main/resources/db/migration)가 적용한다.
# 개발용 Elasticsearch(한국어 분석기 nori 포함)와 Kibana. 첫 실행 때 docker/elasticsearch 이미지를 빌드한다.
# 보안을 끈 단일 노드라 인증 없이 http://localhost:9200 으로 접속한다. ES 와 Kibana 버전은 같아야 한다.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: final_sample
      MYSQL_USER: server
      MYSQL_PASSWORD: server
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -userver -pserver --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  elasticsearch:
    build:
      context: docker/elasticsearch
      args:
        ES_VERSION: 8.19.2
    image: final-project-elasticsearch:8.19.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Seoul
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      interval: 5s
      timeout: 3s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.2
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: ko-KR
      TZ: Asia/Seoul
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  db-data:
  es-data:
